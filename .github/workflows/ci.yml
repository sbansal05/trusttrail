name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  anchor-program:
    name: Anchor Program (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update Rust toolchain
        run: rustup update stable


      # Pinned to exact versions rather than "stable" — the stable resolver
      # in these actions queries GitHub's Releases API directly, which is
      # known to rate-limit and break CI non-deterministically. Pinned here
      # to match the toolchain this project was actually built and tested
      # against locally (Anchor 1.1.2, Solana CLI 4.1.1).
      - name: Setup Solana
        uses: heyAyushh/setup-solana@v5.9
        with:
          solana-cli-version: 4.1.1

      - name: Setup Anchor
        uses: heyAyushh/setup-anchor@v4.999
        with:
          anchor-version: 1.1.2
          solana-cli-version: 4.1.1

      - name: Build program
        run: anchor build

      - name: Run Rust tests
        run: cargo test --manifest-path programs/trusttrail/Cargo.toml

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build
        working-directory: app
        run: npm run build