name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  anchor-program:
    name: Anchor Programs (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Setup Solana
        uses: heyAyushh/setup-solana@v5.9
        with:
          solana-cli-version: 4.1.1

      - name: Reassert stable Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Build programs
        run: |
          cargo build-sbf --manifest-path programs/trusttrail/Cargo.toml
          cargo build-sbf --manifest-path programs/pool/Cargo.toml

      - name: TrustTrail program tests
        run: cargo test -p trusttrail

      - name: Pool program tests (unit + LiteSVM integration)
        run: cargo test -p pool

  backend:
    name: Backend (type check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: backend
        run: npx tsx --test "src/**/*.test.ts"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build
        working-directory: app
        run: npm run build